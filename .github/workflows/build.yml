name: Build APK

# ONE-FILE SETUP: this file builds the whole Android app by itself.
# You only need the game .html uploaded in the repository + this file.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create the Android project
        run: |
          set -e
          # the game = the .html file you uploaded to the repository (any name)
          GAME="$(ls -1 *.html 2>/dev/null | head -1)"
          [ -n "$GAME" ] || { echo "ERROR: upload your game .html file to the repository first"; exit 1; }
          rm -rf android-build
          mkdir -p android-build/app/src/main/assets android-build/app/src/main/res/values android-build/app/src/main/java/com/sifat/guesstheimposter
          cp "$GAME" android-build/app/src/main/assets/index.html
          cd android-build
          cat > settings.gradle <<'GTI_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Guess the Imposter"
          include ':app'
          GTI_EOF
          cat > build.gradle <<'GTI_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GTI_EOF
          cat > gradle.properties <<'GTI_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          GTI_EOF
          cat > app/build.gradle <<'GTI_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sifat.guesstheimposter'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sifat.guesstheimposter"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              // index.html is big and already compressed images inside: don't waste time re-compressing it
              androidResources {
                  noCompress 'html'
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.6.0'
          }
          GTI_EOF
          cat > app/src/main/AndroidManifest.xml <<'GTI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Needed only for the developer-mode server (device list / block). The game itself works fully offline. -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <!-- AdMob app id -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8284549504202077~4871052178" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|smallestScreenSize|screenLayout|uiMode|locale|layoutDirection"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GTI_EOF
          cat > app/src/main/res/values/strings.xml <<'GTI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Guess the Imposter</string>
          </resources>
          GTI_EOF
          cat > app/src/main/java/com/sifat/guesstheimposter/MainActivity.java <<'GTI_EOF'
          package com.sifat.guesstheimposter;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;

          /**
           * Loads the game from assets/index.html (100% offline).
           * Exposes window.GtiNative (getDeviceName / getDeviceId) for the developer-mode device list,
           * and forwards the Back button to window.gtiBack() inside the game.
           */
          public class MainActivity extends Activity {

              private static final String START_URL = "file:///android_asset/index.html";
              private WebView web;

              // AdMob interstitial: one ad when the app opens, one when it is closed (nothing in between)
              private static final String AD_UNIT = "ca-app-pub-8284549504202077/4511959526";
              private static final long OPEN_WAIT_MS = 20000L;
              private int adTries = 0;
              private InterstitialAd interstitial;
              private boolean adLoading = false;
              private boolean openAdDone = false;
              private final long startedAt = System.currentTimeMillis();

              private void loadAd() {
                  if (adLoading || interstitial != null) return;
                  adLoading = true;
                  InterstitialAd.load(this, AD_UNIT, new AdRequest.Builder().build(), new InterstitialAdLoadCallback() {
                      @Override public void onAdLoaded(InterstitialAd ad) {
                          interstitial = ad; adLoading = false;
                          if (!openAdDone) {
                              openAdDone = true;
                              if (System.currentTimeMillis() - startedAt < OPEN_WAIT_MS) showAd(null);
                          }
                      }
                      @Override public void onAdFailedToLoad(LoadAdError e) {
                          interstitial = null; adLoading = false;
                          if (++adTries < 3) {
                              web.postDelayed(() -> loadAd(), 8000);
                          } else {
                              openAdDone = true;
                          }
                      }
                  });
              }

              /** Shows the loaded ad (if any). `after` runs when the ad is closed, or immediately when there is no ad. */
              private void showAd(final Runnable after) {
                  final InterstitialAd ad = interstitial;
                  if (ad == null) { if (after != null) after.run(); return; }
                  interstitial = null;
                  ad.setFullScreenContentCallback(new FullScreenContentCallback() {
                      @Override public void onAdDismissedFullScreenContent() { if (after != null) after.run(); }
                      @Override public void onAdFailedToShowFullScreenContent(AdError e) { if (after != null) after.run(); }
                  });
                  ad.show(this);
              }

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0D0F1A"));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // localStorage: language, volume, developer settings
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setTextZoom(100);                    // ignore the phone's font-size setting
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  web.addJavascriptInterface(new Bridge(), "GtiNative");

                  try {
                      MobileAds.initialize(this, status -> { });
                      loadAd();
                  } catch (Throwable ignored) { }

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String scheme = u.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                              return true;
                          }
                          return false; // file:///android_asset/... stays inside the app
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(START_URL);
                  }
                  hideSystemBars();
              }

              /** JavaScript-visible helpers: window.GtiNative.getDeviceName() / getDeviceId() */
              private class Bridge {
                  @JavascriptInterface
                  public String getDeviceName() {
                      String m = Build.MANUFACTURER == null ? "" : Build.MANUFACTURER.trim();
                      String d = Build.MODEL == null ? "" : Build.MODEL.trim();
                      if (!m.isEmpty() && d.toLowerCase().startsWith(m.toLowerCase())) return d;
                      String name = (m.isEmpty() ? "" : Character.toUpperCase(m.charAt(0)) + m.substring(1) + " ") + d;
                      return name.trim().isEmpty() ? "Android device" : name.trim();
                  }

                  @JavascriptInterface
                  public String getDeviceId() {
                      try {
                          String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                          return id == null ? "" : id;
                      } catch (Exception e) {
                          return "";
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  // Ask the game first: it closes overlays / goes home; only on the home screen do we leave the app.
                  web.evaluateJavascript(
                          "(function(){try{return window.gtiBack?String(window.gtiBack()):'exit'}catch(e){return 'exit'}})()",
                          value -> {
                              if (value == null || value.contains("exit")) {
                                  // developer devices (admin mode) never get ads
                                  web.evaluateJavascript("(function(){try{return window.gtiAdOk?String(window.gtiAdOk()):'true'}catch(e){return 'true'}})()", ok -> {
                                      if (ok != null && ok.contains("false")) finish();
                                      else showAd(() -> finish());
                                  });
                              }
                          });
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }

              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
          GTI_EOF
          pip install --quiet pillow
          python3 - <<'GTI_EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont
          im = Image.open("../icon.png").convert("RGBA")
          for n, px in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              p = "app/src/main/res/mipmap-" + n
              os.makedirs(p, exist_ok=True)
              im.resize((px, px), Image.LANCZOS).save(p + "/ic_launcher.png")
          GTI_EOF

      - name: Build APK
        run: |
          cd android-build
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Guess-the-Imposter.apk

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guess-the-Imposter-APK
          path: Guess-the-Imposter.apk

      - name: Publish APK in Releases (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep only the newest release: delete every older one (and its tag)
          for tg in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release delete "$tg" --cleanup-tag -y || true
          done
          gh release create "latest" Guess-the-Imposter.apk \
            --title "Guess the Imposter APK (build #${{ github.run_number }})" \
            --notes "Offline Android app. Download Guess-the-Imposter.apk and install it."
